server {
    listen 80;
    server_name sonar.buy-01.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sonar.buy-01.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/sonar.buy-01.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonar.buy-01.duckdns.org/privkey.pem;

    # Scanners upload their analysis report here. nginx allows 1 MB by default.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
