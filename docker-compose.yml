x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-java: &java
  JAVA_TOOL_OPTIONS: >-
    -Xms64m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m
    -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
  LOGGING_LEVEL_ROOT: WARN
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

x-mongo-health: &mongo-health
  test:
    [
      "CMD",
      "mongosh",
      "--quiet",
      "--norc",
      "--eval",
      "db.adminCommand('ping').ok",
    ]
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s

x-mongo-cmd:
  &mongo-cmd [
    "mongod",
    "--quiet",
    "--wiredTigerCacheSizeGB",
    "0.25",
    "--setParameter",
    "diagnosticDataCollectionEnabled=false",
  ]

services:
  discovery-server:
    build: ./backend/discovery-server/
    container_name: discovery-server
    restart: unless-stopped
    mem_limit: 320m
    logging: *logging
    environment:
      <<: *java
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx192m -Xss512k -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    networks:
      - ecommerce-network

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BROKER}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 52428800
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network

  mongo-user:
    image: mongo:7
    container_name: mongo-user
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    command: *mongo-cmd
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_PASSWORD}
    volumes:
      - mongo-user-data:/data/db
    networks:
      - ecommerce-network
    healthcheck: *mongo-health

  mongo-media:
    image: mongo:7
    container_name: mongo-media
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    command: *mongo-cmd
    environment:
      MONGO_INITDB_DATABASE: ${MEDIA_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_DB_PWD}
    volumes:
      - media-mongo-data:/data/db
    networks:
      - ecommerce-network
    healthcheck: *mongo-health

  mongo-product:
    image: mongo:7
    container_name: mongo-product
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    command: *mongo-cmd
    environment:
      MONGO_INITDB_DATABASE: ${PRODUCT_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_DB_PWD}
    volumes:
      - product-mongo-data:/data/db
    networks:
      - ecommerce-network
    healthcheck: *mongo-health

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
      args:
        SSL_PASSWORD: ${SSL_PASSWORD}
    container_name: api-gateway
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8080"
    depends_on:
      - discovery-server
    environment:
      <<: *java
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SSL_PASSWORD: ${SSL_PASSWORD}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY}
      RATE_LIMIT_REFILL_MINUTES: ${RATE_LIMIT_REFILL_MINUTES}
    networks:
      - ecommerce-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      mongo-user:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *java
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: http://discovery-server:8761/eureka
      USER_MONGO_HOST: mongo-user
      USER_MONGO_PORT: 27017
      USER_MONGO_DB: ${USER_MONGO_DB}
      USER_MONGO_USERNAME: ${USER_MONGO_USERNAME}
      USER_MONGO_PASSWORD: ${USER_MONGO_PASSWORD}
      KAFKA_BROKER: kafka:9092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    volumes:
      - ./uploads/avatars:/app/uploads/avatars
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      mongo-product:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *java
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: http://discovery-server:8761/eureka
      PRODUCT_MONGO_HOST: mongo-product
      PRODUCT_MONGO_LOCAL_PORT: 27017
      PRODUCT_MONGO_DB_NAME: ${PRODUCT_MONGO_DB_NAME}
      PRODUCT_MONGO_DB_USER: ${PRODUCT_MONGO_DB_USER}
      PRODUCT_MONGO_DB_PWD: ${PRODUCT_MONGO_DB_PWD}
      KAFKA_BROKER: kafka:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    networks:
      - ecommerce-network

  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: media-service
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      mongo-media:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *java
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_URL: http://discovery-server:8761/eureka
      MEDIA_MONGO_HOST: mongo-media
      MEDIA_MONGO_LOCAL_PORT: 27017
      MEDIA_MONGO_DB_NAME: ${MEDIA_MONGO_DB_NAME}
      MEDIA_MONGO_DB_USER: ${MEDIA_MONGO_DB_USER}
      MEDIA_MONGO_DB_PWD: ${MEDIA_MONGO_DB_PWD}
      KAFKA_BROKER: kafka:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    volumes:
      - ./uploads/media:/app/uploads
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SSL_PASSWORD: ${SSL_PASSWORD}
    container_name: frontend
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    ports:
      - "127.0.0.1:4200:443"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongo-user-data:
  product-mongo-data:
  media-mongo-data:
  kafka-data:

