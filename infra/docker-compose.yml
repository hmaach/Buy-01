# Jenkins controller. Never merged with the app compose at the repo root:
# a deploy of the app must not restart the Jenkins that runs it.
services:
  jenkins:
    build: ./jenkins
    image: buy01/jenkins:2.580.2
    container_name: jenkins
    restart: unless-stopped
    mem_limit: 1280m
    # Localhost only: host nginx (proxy/jenkins.conf) adds TLS in front of it.
    ports:
      - "127.0.0.1:8090:8090"
    # Lets the controller reach the build agent, which runs on this same VM as the jenkins-agent user over SSH.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_OPTS: -Xmx768m -Djenkins.install.runSetupWizard=false
      JENKINS_OPTS: --httpPort=8090
      CASC_JENKINS_CONFIG: /var/jenkins_conf
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_URL: ${JENKINS_URL}
      GITHUB_USER: ${GITHUB_USER}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL}
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8090/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  sonar-db:
    image: postgres:17.12-alpine
    container_name: sonar-db
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks: [sonar]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 30s
      retries: 5

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    mem_limit: 2304m
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_CORE_SERVERBASEURL: https://sonar.buy-01.duckdns.org
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_JAVAOPTS: -Xmx384m -Xms128m
      SONAR_CE_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_SEARCH_JAVAOPTS: -Xmx384m -Xms384m
      SONAR_TELEMETRY_ENABLE: "false"
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks: [sonar]
  
volumes:
  jenkins-home:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonar-db-data:

networks:
  sonar:
