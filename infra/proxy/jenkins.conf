# Host nginx site for Jenkins, kept in git so the proxy can be rebuilt too.
# Written for nginx older than 1.25: http2 is set on the listen line.
# Install: see "Reverse proxy" in infra/README.md. Certificate paths are the certbot defaults.
server {
    listen 80;
    server_name jenkins.buy-01.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jenkins.buy-01.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/jenkins.buy-01.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.buy-01.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Jenkins builds its links and checks CSRF crumbs from these headers.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        # Stream console logs instead of buffering them.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }
}
