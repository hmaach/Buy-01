services:
  # servers
  discovery-server:
    build: ./backend/discovery-server/
    container_name: discovery-server
    restart: always
    ports:
      - "${DISCOVERY_PORT}:8761"
    networks:
      - ecommerce-network

  # kafka broker
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BROKER}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network

  # USER DATABASE
  mongo-user:
    image: mongo:7
    container_name: mongo-user
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_PASSWORD}
    volumes:
      - mongo-user-data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MEDIA DATABASE
  mongo-media:
    container_name: ${MEDIA_MONGO_DB_NAME}
    image: mongo:7
    restart: always
    ports:
      - "${MEDIA_MONGO_LOCAL_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MEDIA_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_DB_PWD}
    volumes:
      - media-mongo-data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PRODUCT DATABASE
  mongo-product:
    container_name: ${PRODUCT_MONGO_DB_NAME}
    image: mongo:7
    restart: always
    ports:
      - "${PRODUCT_MONGO_LOCAL_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${PRODUCT_MONGO_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_DB_PWD}
    volumes:
      - product-mongo-data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API GATEWAY
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
      args:
        SSL_PASSWORD: ${SSL_PASSWORD}
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      - discovery-server
      - user-service
      - product-service
      - media-service
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - SSL_PASSWORD=${SSL_PASSWORD}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      - RATE_LIMIT_CAPACITY=${RATE_LIMIT_CAPACITY}
      - RATE_LIMIT_REFILL_MINUTES=${RATE_LIMIT_REFILL_MINUTES}
    networks:
      - ecommerce-network

  # USER SERVICE
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    depends_on:
      mongo-user:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - USER_MONGO_HOST=mongo-user
      - USER_MONGO_PORT=27017
      - USER_MONGO_DB=${USER_MONGO_DB}
      - USER_MONGO_USERNAME=${USER_MONGO_USERNAME}
      - USER_MONGO_PASSWORD=${USER_MONGO_PASSWORD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - MEDIA_SERVICE_URL=http://media-service:8083
    volumes:
      - ./uploads/avatars:/app/uploads/avatars
    networks:
      - ecommerce-network

  # PRODUCT SERVICE
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      mongo-product:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - PRODUCT_MONGO_HOST=mongo-product
      - PRODUCT_MONGO_LOCAL_PORT=27017
      - PRODUCT_MONGO_DB_NAME=${PRODUCT_MONGO_DB_NAME}
      - PRODUCT_MONGO_DB_USER=${PRODUCT_MONGO_DB_USER}
      - PRODUCT_MONGO_DB_PWD=${PRODUCT_MONGO_DB_PWD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    networks:
      - ecommerce-network

  # MEDIA SERVICE
  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: media-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      mongo-media:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=http://discovery-server:8761/eureka
      - MEDIA_MONGO_HOST=mongo-media
      - MEDIA_MONGO_LOCAL_PORT=27017
      - MEDIA_MONGO_DB_NAME=${MEDIA_MONGO_DB_NAME}
      - MEDIA_MONGO_DB_USER=${MEDIA_MONGO_DB_USER}
      - MEDIA_MONGO_DB_PWD=${MEDIA_MONGO_DB_PWD}
      - KAFKA_BROKER=kafka:9092
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    volumes:
      - ./uploads/media:/app/uploads/media
    networks:
      - ecommerce-network

  # FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SSL_PASSWORD: ${SSL_PASSWORD}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:443"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

  # jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8084:8080"   
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      # Optional: Mount the docker socket to run docker commands inside Jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

# NETWORK
networks:
  ecommerce-network:
    driver: bridge

# VOLUMES
volumes:
  mongo-user-data:
  product-mongo-data:
  media-mongo-data:
  kafka-data:
  jenkins_home:
